[package]
name = "anki-wait-sidecar"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "One-shot CLI over Anki's Rust core: AnkiWeb sync and reviews for the anki-wait mod"
publish = false

[[bin]]
name = "anki-wait-sidecar"
path = "src/main.rs"

[dependencies]
# Anki's own core (rslib). Pin to a release tag; bump it alongside Anki releases.
anki = { git = "https://github.com/ankitects/anki.git", tag = "26.09.3", features = ["rustls"] }
# Must match the versions rslib uses, since we hand it a reqwest::Client.
reqwest = { version = "0.12.20", default-features = false }
tokio = { version = "1.45", features = ["rt"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
dirs = "6.0.0"
regex = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
